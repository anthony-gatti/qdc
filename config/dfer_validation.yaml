  memory_efficiency: 1.0
  memory_coherence_time_s: 5.0
  memories_per_node: 16
  gate_fidelity: 1.0
  measurement_fidelity: 1.0
  swapping_success_probability: 1.0
  link_parallelism: 1

topology:
  type: linear
  num_nodes: 4
  inter_node_distance_m: 1000.0
  qdc_node_index: 0
  random_seed: 8
  extra_mesh_edges: 0
