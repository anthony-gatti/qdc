experiment:
  algorithms: [odo, acp_freshest, qcast]
  seeds: [0, 1, 2]
  simulation_end_time_s: 1.6

workload:
  name: qpq
  database_size_log: 2
  num_clients: 3
  queries_per_client: 1
  round_deadline_s: 0.8
  transaction_duration_s: 1.5
  request_period_s: 1.0
  start_offset_s: 0.03
  fidelity_threshold: 0.7

algorithm:
  adaptive_max_memory: 4
  cache_strategy: freshest
  purification: false
  execution_profile: asynchronous
  edge_width: 1
  generation_window_s: 0.005
  control_processing_delay_s: 0.0001
  swap_success_probability: 0.9
  link_state_hops: 3
  recovery_paths_per_segment: 1
  max_recovery_paths_per_major: 12
  max_major_paths: 30
  max_hops: 8

hardware:
  link_fidelity: 0.99
  memory_efficiency: 0.5
  memory_coherence_time_s: 5.0
  memories_per_node: 20
  gate_fidelity: 0.99
  measurement_fidelity: 0.99
  swapping_success_probability: 0.9
  link_parallelism: 1

topology:
  type: hub_spoke
  num_nodes: 5
  inter_node_distance_m: 20000.0
  qdc_node_index: 2
  random_seed: 0
  extra_mesh_edges: 3
