# Historical QPQ presentation reproduction configuration.
# This intentionally includes ACP m6 for reproduction, but it is not the
# repository default because m6 is expensive under the current port.

hardware:
  link_fidelity: 0.99
  memory_efficiency: 0.5
  memory_coherence_time_s: 5.0
  memories_per_node: 50
  acp_memory: 6
  gate_fidelity: 0.99
  measurement_fidelity: 0.99

workload:
  mode: "qpq"
  database_size_log: 10
  num_clients: 10
  queries_per_client: 3
  round_deadline_s: 5.0
  reservation_duration_s: 5.0
  request_period_s: 6.0
  start_offset_s: 2.0
  fidelity_threshold: 0.7

topology:
  type: "hub_spoke"
  num_nodes: 25
  inter_node_distance_m: 20000.0
  qdc_node_index: 12
  random_seed: 42
  extra_mesh_edges: 3

experiment:
  backends:
    - "odo"
    - "acp_no_bg"
    - "acp_m1"
    - "acp_m6"
  distances_km: [10.0, 20.0, 30.0, 40.0]
  db_sizes: [5, 10, 15, 20]
  num_trials: 15
  simulation_end_time_s: 180.0
  output_dir: "post_port_historical"
